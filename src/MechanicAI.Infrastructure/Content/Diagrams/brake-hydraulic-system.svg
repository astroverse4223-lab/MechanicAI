<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Segoe UI, Arial, sans-serif">
<title>Brake Hydraulic System</title>
<desc>Brake pedal, booster, dual master cylinder with reservoir, ABS hydraulic unit and lines to front calipers and rear wheel cylinders, with two separate circuits.</desc>
<defs><marker id="bhs-aa10" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#fbbc04"/></marker><marker id="bhs-ab10" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#8ab4f8"/></marker></defs>
<rect x="0.75" y="0.75" width="798.5" height="448.5" rx="14" fill="#16181d" stroke="#3a3f47" stroke-width="1.5"/>
<rect x="24" y="21" width="4" height="21" rx="2" fill="#8ab4f8"/>
<text x="38" y="38" font-size="18" fill="#e8eaed" font-weight="600">Brake Hydraulic System</text>
<text x="38" y="57" font-size="12" fill="#9aa0a6">Pedal force is boosted, converted to hydraulic pressure, and delivered to all four wheels through the ABS unit.</text>
<circle cx="64" cy="112" r="5" fill="#bdc1c6"/>
<line x1="64" y1="112" x2="52" y2="236" stroke="#bdc1c6" stroke-width="5" stroke-linecap="round"/>
<rect x="35" y="234" width="34" height="10" rx="3" fill="#bdc1c6"/>
<line x1="60" y1="172" x2="110" y2="172" stroke="#bdc1c6" stroke-width="3"/>
<text x="52" y="264" font-size="12" fill="#e8eaed" text-anchor="middle" font-weight="600">Brake pedal</text>
<circle cx="150" cy="172" r="42" fill="#23272e" stroke="#bdc1c6" stroke-width="1.5"/>
<line x1="150" y1="134" x2="150" y2="210" stroke="#5f6368" stroke-width="2"/>
<text x="150" y="236" font-size="12" fill="#e8eaed" text-anchor="middle" font-weight="600">Brake booster</text>
<text x="150" y="251" font-size="12" fill="#9aa0a6" text-anchor="middle">multiplies pedal force</text>
<rect x="204" y="126" width="88" height="26" rx="4" fill="#23272e" stroke="#bdc1c6" stroke-width="1.2"/>
<rect x="205" y="136" width="86" height="15" fill="#fbbc04" fill-opacity="0.3"/>
<rect x="222" y="152" width="8" height="7" fill="#bdc1c6"/>
<rect x="262" y="152" width="8" height="7" fill="#bdc1c6"/>
<rect x="192" y="159" width="110" height="26" rx="4" fill="#2d3139" stroke="#bdc1c6" stroke-width="1.2"/>
<rect x="212" y="163" width="30" height="18" fill="#8ab4f8" fill-opacity="0.35"/>
<rect x="252" y="163" width="44" height="18" fill="#fbbc04" fill-opacity="0.35"/>
<rect x="204" y="163" width="8" height="18" rx="1" fill="#bdc1c6"/>
<rect x="244" y="163" width="8" height="18" rx="1" fill="#bdc1c6"/>
<text x="248" y="116" font-size="12" fill="#e8eaed" text-anchor="middle" font-weight="600">Master cylinder + reservoir</text>
<path d="M302,168 L356,168" fill="none" stroke="#fbbc04" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#bhs-aa10)"/>
<path d="M228,185 L228,196 Q228,202 234,202 L356,202" fill="none" stroke="#8ab4f8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#bhs-ab10)"/>
<text x="330" y="161" font-size="12" fill="#fbbc04" text-anchor="middle" font-weight="600">Circuit 1</text>
<text x="318" y="218" font-size="12" fill="#8ab4f8" text-anchor="middle" font-weight="600">Circuit 2</text>
<rect x="360" y="140" width="104" height="92" rx="6" fill="#23272e" stroke="#bdc1c6" stroke-width="1.5"/>
<text x="412" y="175.6" font-size="13" fill="#e8eaed" text-anchor="middle" font-weight="600">ABS unit</text>
<text x="412" y="190.6" font-size="12" fill="#9aa0a6" text-anchor="middle">valves, pump</text>
<text x="412" y="205.6" font-size="12" fill="#9aa0a6" text-anchor="middle">+ module</text>
<rect x="520" y="78" width="136" height="348" rx="36" fill="#1c1f25" stroke="#5f6368" stroke-width="1.5"/>
<polygon points="588,88 596,98 580,98" fill="#9aa0a6"/>
<text x="588" y="112" font-size="12" fill="#9aa0a6" text-anchor="middle" font-weight="600">FRONT</text>
<rect x="500" y="108" width="22" height="60" rx="6" fill="#2a2d33" stroke="#bdc1c6" stroke-width="1.2"/>
<rect x="654" y="108" width="22" height="60" rx="6" fill="#2a2d33" stroke="#bdc1c6" stroke-width="1.2"/>
<rect x="500" y="336" width="22" height="60" rx="6" fill="#2a2d33" stroke="#bdc1c6" stroke-width="1.2"/>
<rect x="654" y="336" width="22" height="60" rx="6" fill="#2a2d33" stroke="#bdc1c6" stroke-width="1.2"/>
<rect x="524" y="122" width="14" height="32" rx="3" fill="#23272e" stroke="#fbbc04" stroke-width="1.5"/>
<rect x="524" y="352" width="14" height="26" rx="7" fill="#23272e" stroke="#fbbc04" stroke-width="1.5"/>
<rect x="638" y="122" width="14" height="32" rx="3" fill="#23272e" stroke="#fbbc04" stroke-width="1.5"/>
<rect x="638" y="352" width="14" height="26" rx="7" fill="#23272e" stroke="#fbbc04" stroke-width="1.5"/>
<text x="546" y="404" font-size="12" fill="#9aa0a6" font-weight="600">LR</text>
<text x="630" y="404" font-size="12" fill="#9aa0a6" text-anchor="end" font-weight="600">RR</text>
<text x="546" y="184" font-size="12" fill="#9aa0a6" font-weight="600">LF</text>
<text x="630" y="184" font-size="12" fill="#9aa0a6" text-anchor="end" font-weight="600">RF</text>
<path d="M464,160 L556,160 Q562,160 562,154 L562,144 Q562,138 556,138 L543,138" fill="none" stroke="#fbbc04" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#bhs-aa10)"/>
<path d="M464,176 L604,176 Q610,176 610,170 L610,144 Q610,138 616,138 L633,138" fill="none" stroke="#8ab4f8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#bhs-ab10)"/>
<path d="M464,204 L598,204 Q604,204 604,210 L604,359 Q604,365 610,365 L633,365" fill="none" stroke="#fbbc04" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#bhs-aa10)"/>
<path d="M464,218 L562,218 Q568,218 568,224 L568,359 Q568,365 562,365 L543,365" fill="none" stroke="#8ab4f8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#bhs-ab10)"/>
<text x="684" y="130" font-size="12" fill="#e8eaed" font-weight="600">Front disc</text>
<text x="684" y="145" font-size="12" fill="#e8eaed" font-weight="600">caliper</text>
<text x="684" y="162" font-size="12" fill="#9aa0a6">(each side)</text>
<text x="684" y="358" font-size="12" fill="#e8eaed" font-weight="600">Rear drum</text>
<text x="684" y="373" font-size="12" fill="#e8eaed" font-weight="600">wheel cylinder</text>
<text x="684" y="390" font-size="12" fill="#9aa0a6">(or disc caliper)</text>
<circle cx="33" cy="296" r="9" fill="#8ab4f8"/>
<text x="33" y="300.3" font-size="12" fill="#16181d" text-anchor="middle" font-weight="700">1</text>
<text x="48" y="300" font-size="12" fill="#9aa0a6">The booster multiplies driver force on the master cylinder pushrod.</text>
<circle cx="33" cy="320" r="9" fill="#8ab4f8"/>
<text x="33" y="324.3" font-size="12" fill="#16181d" text-anchor="middle" font-weight="700">2</text>
<text x="48" y="324" font-size="12" fill="#9aa0a6">The master cylinder converts force into pressure in two separate</text>
<text x="48" y="340" font-size="12" fill="#9aa0a6">circuits.</text>
<circle cx="33" cy="360" r="9" fill="#8ab4f8"/>
<text x="33" y="364.3" font-size="12" fill="#16181d" text-anchor="middle" font-weight="700">3</text>
<text x="48" y="364" font-size="12" fill="#9aa0a6">During an ABS event the unit holds, releases and reapplies pressure at</text>
<text x="48" y="380" font-size="12" fill="#9aa0a6">each wheel.</text>
<circle cx="33" cy="400" r="9" fill="#8ab4f8"/>
<text x="33" y="404.3" font-size="12" fill="#16181d" text-anchor="middle" font-weight="700">4</text>
<text x="48" y="404" font-size="12" fill="#9aa0a6">Calipers and wheel cylinders turn pressure into clamping force.</text>
<text x="24" y="432" font-size="12" fill="#9aa0a6" font-style="italic">Diagonal split shown; front/rear split is also common.</text>
</svg>
