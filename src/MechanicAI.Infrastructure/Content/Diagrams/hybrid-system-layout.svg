<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Segoe UI, Arial, sans-serif">
<title>Hybrid System Layout (Power-Split)</title>
<desc>Power-split hybrid: engine, MG1, MG2, planetary power-split device, inverter, HV battery, DC-DC converter and 12 V battery, with mechanical and electrical power paths.</desc>
<rect x="0.75" y="0.75" width="798.5" height="448.5" rx="14" fill="#16181d" stroke="#3a3f47" stroke-width="1.5"/>
<rect x="24" y="21" width="4" height="21" rx="2" fill="#8ab4f8"/>
<text x="38" y="38" font-size="18" fill="#e8eaed" font-weight="600">Hybrid System Layout (Power-Split)</text>
<text x="38" y="57" font-size="12" fill="#9aa0a6">The engine and two motor-generators are joined by a planetary power-split device.</text>
<line x1="548" y1="87" x2="570" y2="87" stroke="#bdc1c6" stroke-width="4.5" stroke-linecap="round"/>
<text x="576" y="91" font-size="12" fill="#9aa0a6">Mechanical</text>
<line x1="652.4" y1="87" x2="674.4" y2="87" stroke="#ff8c1a" stroke-width="4.5" stroke-linecap="round"/>
<text x="680.4" y="91" font-size="12" fill="#9aa0a6">HV</text>
<line x1="706.9" y1="87" x2="728.9" y2="87" stroke="#f28b82" stroke-width="2.5" stroke-linecap="round"/>
<text x="734.9" y="91" font-size="12" fill="#9aa0a6">12 V</text>
<rect x="30" y="168" width="120" height="92" rx="6" fill="#23272e" stroke="#5f6368" stroke-width="1.5"/>
<text x="90" y="211.1" font-size="13" fill="#e8eaed" text-anchor="middle" font-weight="600">Engine</text>
<text x="90" y="226.1" font-size="12" fill="#9aa0a6" text-anchor="middle">(ICE)</text>
<rect x="190" y="104" width="344" height="216" rx="12" fill="none" stroke="#9aa0a6" stroke-width="1.2" stroke-dasharray="6 4"/>
<text x="204" y="124" font-size="12" fill="#9aa0a6" font-weight="600">Hybrid transaxle</text>
<circle cx="362" cy="214" r="32" fill="#81c995" stroke="#81c995" stroke-width="2" fill-opacity="0.12"/>
<polygon points="362,233 345.5,204.5 378.5,204.5" fill="none" stroke="#8ab4f8" stroke-width="4" stroke-opacity="0.5" stroke-linejoin="round"/>
<circle cx="362" cy="233" r="8" fill="#8ab4f8" stroke="#8ab4f8" stroke-width="1.5" fill-opacity="0.35"/>
<circle cx="345.5" cy="204.5" r="8" fill="#8ab4f8" stroke="#8ab4f8" stroke-width="1.5" fill-opacity="0.35"/>
<circle cx="378.5" cy="204.5" r="8" fill="#8ab4f8" stroke="#8ab4f8" stroke-width="1.5" fill-opacity="0.35"/>
<circle cx="362" cy="214" r="8" fill="#fbbc04" stroke="#fbbc04" stroke-width="1.5" fill-opacity="0.5"/>
<text x="338" y="262" font-size="12" fill="#e8eaed" text-anchor="end" font-weight="600">Power-split device</text>
<text x="338" y="277" font-size="12" fill="#9aa0a6" text-anchor="end">(planetary gear set)</text>
<rect x="298" y="128" width="128" height="44" rx="6" fill="#23272e" stroke="#ff8c1a" stroke-width="1.5"/>
<text x="362" y="147.1" font-size="13" fill="#e8eaed" text-anchor="middle" font-weight="600">MG1</text>
<text x="362" y="162.1" font-size="12" fill="#9aa0a6" text-anchor="middle">generator / starter</text>
<rect x="430" y="190" width="92" height="48" rx="6" fill="#23272e" stroke="#ff8c1a" stroke-width="1.5"/>
<text x="476" y="211.1" font-size="13" fill="#e8eaed" text-anchor="middle" font-weight="600">MG2</text>
<text x="476" y="226.1" font-size="12" fill="#9aa0a6" text-anchor="middle">drive motor</text>
<line x1="150" y1="214" x2="330" y2="214" stroke="#80868b" stroke-width="7"/>
<line x1="362" y1="172" x2="362" y2="206" stroke="#80868b" stroke-width="5"/>
<line x1="394" y1="214" x2="430" y2="214" stroke="#80868b" stroke-width="7"/>
<line x1="362" y1="246" x2="362" y2="298" stroke="#80868b" stroke-width="7"/>
<text x="262" y="206" font-size="12" fill="#9aa0a6" text-anchor="middle">engine &#8594; carrier</text>
<text x="370" y="194" font-size="12" fill="#fbbc04" font-weight="600">sun</text>
<text x="412" y="206" font-size="12" fill="#81c995" text-anchor="middle" font-weight="600">ring</text>
<rect x="342" y="298" width="40" height="18" rx="3" fill="#2d3139" stroke="#bdc1c6" stroke-width="1.2"/>
<text x="392" y="311" font-size="12" fill="#9aa0a6">ring &#8594; final drive</text>
<line x1="362" y1="316" x2="362" y2="346" stroke="#80868b" stroke-width="6"/>
<line x1="174" y1="346" x2="546" y2="346" stroke="#80868b" stroke-width="6"/>
<rect x="152" y="318" width="24" height="56" rx="6" fill="#2a2d33" stroke="#bdc1c6" stroke-width="1.2"/>
<rect x="544" y="318" width="24" height="56" rx="6" fill="#2a2d33" stroke="#bdc1c6" stroke-width="1.2"/>
<text x="260" y="340" font-size="12" fill="#9aa0a6" text-anchor="middle">Drive axle</text>
<rect x="584" y="118" width="176" height="58" rx="6" fill="#23272e" stroke="#ff8c1a" stroke-width="1.5"/>
<text x="672" y="144.1" font-size="13" fill="#e8eaed" text-anchor="middle" font-weight="600">Inverter</text>
<text x="672" y="159.1" font-size="12" fill="#9aa0a6" text-anchor="middle">+ boost converter</text>
<rect x="584" y="262" width="176" height="56" rx="6" fill="#23272e" stroke="#ff8c1a" stroke-width="1.5"/>
<text x="672" y="287.1" font-size="13" fill="#e8eaed" text-anchor="middle" font-weight="600">HV battery</text>
<text x="672" y="302.1" font-size="12" fill="#9aa0a6" text-anchor="middle">(NiMH or Li-ion)</text>
<rect x="584" y="346" width="96" height="44" rx="6" fill="#23272e" stroke="#ff8c1a" stroke-width="1.5"/>
<text x="632" y="365.1" font-size="13" fill="#e8eaed" text-anchor="middle" font-weight="600">DC-DC</text>
<text x="632" y="380.1" font-size="12" fill="#9aa0a6" text-anchor="middle">HV &#8594; 12 V</text>
<rect x="690" y="346" width="70" height="44" rx="6" fill="#23272e" stroke="#f28b82" stroke-width="1.5"/>
<text x="725" y="365.1" font-size="13" fill="#e8eaed" text-anchor="middle" font-weight="600">12 V</text>
<text x="725" y="380.1" font-size="12" fill="#9aa0a6" text-anchor="middle">battery</text>
<path d="M584,140 L426,140" fill="none" stroke="#ff8c1a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M640,176 L640,200 Q640,206 634,206 L526,206" fill="none" stroke="#ff8c1a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="492" y="132" font-size="12" fill="#ff8c1a" text-anchor="middle" font-weight="600">3-phase AC</text>
<path d="M712,262 L712,176" fill="none" stroke="#ff8c1a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="720" y="224" font-size="12" fill="#ff8c1a" font-weight="600">HV DC</text>
<path d="M620,318 L620,346" fill="none" stroke="#ff8c1a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M680,368 L690,368" fill="none" stroke="#f28b82" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="24" y="402" font-size="12" fill="#9aa0a6">MG1 starts the engine and generates; MG2 drives and regenerates during braking.</text>
<text x="24" y="418" font-size="12" fill="#9aa0a6">The planetary gear set blends engine and motor power &#8212; no conventional shifting.</text>
<text x="24" y="436" font-size="12" fill="#9aa0a6" font-style="italic">Other hybrid designs place the motor(s) differently &#8212; always follow the OEM HV procedure.</text>
</svg>
