<polyline points="190,217 196,290" fill="none" stroke="#9aa0a6" stroke-width="1" stroke-opacity="0.9"/>
<circle cx="190" cy="217" r="2.2" fill="#9aa0a6"/>
<text x="200" y="294" font-size="12" fill="#e8eaed" font-weight="600">Tie rod</text>
<polyline points="233,207 236,156" fill="none" stroke="#9aa0a6" stroke-width="1" stroke-opacity="0.9"/>
<circle cx="233" cy="207" r="2.2" fill="#9aa0a6"/>
<text x="240" y="160" font-size="12" fill="#e8eaed" font-weight="600">Bellows boot</text>
<circle cx="33" cy="318" r="9" fill="#8ab4f8"/>
<text x="33" y="322.3" font-size="12" fill="#16181d" text-anchor="middle" font-weight="700">1</text>
<text x="48" y="322" font-size="12" fill="#9aa0a6">The steering wheel turns the column</text>
<text x="48" y="338" font-size="12" fill="#9aa0a6">and pinion.</text>
<circle cx="33" cy="358" r="9" fill="#8ab4f8"/>
<text x="33" y="362.3" font-size="12" fill="#16181d" text-anchor="middle" font-weight="700">2</text>
<text x="48" y="362" font-size="12" fill="#9aa0a6">Pinion teeth drive the rack</text>
<text x="48" y="378" font-size="12" fill="#9aa0a6">sideways.</text>
<circle cx="33" cy="398" r="9" fill="#8ab4f8"/>
<text x="33" y="402.3" font-size="12" fill="#16181d" text-anchor="middle" font-weight="700">3</text>
<text x="48" y="402" font-size="12" fill="#9aa0a6">Tie rods push or pull the steering</text>
<text x="48" y="418" font-size="12" fill="#9aa0a6">arms; the wheels pivot on the</text>
<text x="48" y="434" font-size="12" fill="#9aa0a6">knuckles.</text>
<rect x="484" y="262" width="292" height="170" rx="10" fill="#1c1f25" stroke="#2c3037" stroke-width="1"/>
