<text x="38" y="38" font-size="18" fill="#e8eaed" font-weight="600">Starting Circuit</text>
<text x="38" y="57" font-size="12" fill="#9aa0a6">A low-current control circuit energizes the solenoid, which switches the high-current battery cable to the starter motor.</text>
