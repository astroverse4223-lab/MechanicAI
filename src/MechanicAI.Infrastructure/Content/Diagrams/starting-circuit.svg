<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Segoe UI, Arial, sans-serif">
<title>Starting Circuit</title>
<desc>Starting circuit: battery, fuse, ignition switch, neutral safety switch, starter relay, solenoid with windings and main contacts, starter motor, pinion and flywheel ring gear, and ground paths.</desc>
