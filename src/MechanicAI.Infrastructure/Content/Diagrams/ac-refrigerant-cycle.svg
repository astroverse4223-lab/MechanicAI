<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Segoe UI, Arial, sans-serif">
<title>A/C Refrigerant Cycle</title>
<desc>A/C refrigerant cycle: compressor, condenser, receiver-drier, expansion device (TXV or orifice tube), evaporator and accumulator, with high and low sides and refrigerant states.</desc>
