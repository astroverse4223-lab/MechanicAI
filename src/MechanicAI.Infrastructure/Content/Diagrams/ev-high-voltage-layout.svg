<text x="334" y="119.7" font-size="12" fill="#e8eaed" text-anchor="middle" font-weight="600">A/C compressor</text>
<text x="334" y="134.7" font-size="12" fill="#9aa0a6" text-anchor="middle">(electric)</text>
