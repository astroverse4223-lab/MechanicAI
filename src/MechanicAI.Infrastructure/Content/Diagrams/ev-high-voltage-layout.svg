<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Segoe UI, Arial, sans-serif">
<title>EV High-Voltage Layout</title>
<desc>Battery-electric vehicle HV layout: HV battery with service disconnect, contactors and BMS, junction box, inverter and motor, DC-DC converter and 12 V battery, on-board charger and charge port.</desc>
<rect x="0.75" y="0.75" width="798.5" height="448.5" rx="14" fill="#16181d" stroke="#3a3f47" stroke-width="1.5"/>
<rect x="24" y="21" width="4" height="21" rx="2" fill="#8ab4f8"/>
<text x="38" y="38" font-size="18" fill="#e8eaed" font-weight="600">EV High-Voltage Layout</text>
<text x="38" y="57" font-size="12" fill="#9aa0a6">Orange cables are high voltage. The HV system is isolated from the vehicle chassis.</text>
<rect x="24" y="96" width="92" height="54" rx="6" fill="#23272e" stroke="#f28b82" stroke-width="1.5"/>
<text x="70" y="119.7" font-size="12" fill="#e8eaed" text-anchor="middle" font-weight="600">12 V battery</text>
<text x="70" y="134.7" font-size="12" fill="#9aa0a6" text-anchor="middle">modules, relays</text>
<rect x="140" y="96" width="116" height="54" rx="6" fill="#23272e" stroke="#ff8c1a" stroke-width="1.5"/>
<text x="198" y="119.7" font-size="12" fill="#e8eaed" text-anchor="middle" font-weight="600">DC-DC converter</text>
<text x="198" y="134.7" font-size="12" fill="#9aa0a6" text-anchor="middle">HV &#8594; 12 V</text>
