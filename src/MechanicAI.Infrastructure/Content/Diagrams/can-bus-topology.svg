<text x="38" y="341" font-size="13" fill="#e8eaed" font-weight="600">Resistance check</text>
<text x="38" y="362" font-size="12" fill="#9aa0a6">Key off, battery disconnected, CAN-H to CAN-L:</text>
<text x="38" y="378" font-size="12" fill="#9aa0a6">&#8776; 60 &#937; = two 120 &#937; terminators in parallel.</text>
<text x="38" y="394" font-size="12" fill="#9aa0a6">&#8776; 120 &#937; suggests an open terminator or bus wire.</text>
<text x="38" y="420" font-size="12" fill="#9aa0a6" font-style="italic">General guideline &#8212; verify per OEM service information.</text>
