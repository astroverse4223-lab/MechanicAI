<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Segoe UI, Arial, sans-serif">
<title>CAN Bus Topology</title>
<desc>High-speed CAN bus: twisted pair CAN-H and CAN-L with 120 ohm termination at both ends, nodes ECM, TCM, ABS, BCM, gateway and the DLC, plus typical voltage levels and the resistance check.</desc>
