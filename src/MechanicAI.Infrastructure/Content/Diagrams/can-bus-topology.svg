<text x="38" y="38" font-size="18" fill="#e8eaed" font-weight="600">CAN Bus Topology</text>
<text x="38" y="57" font-size="12" fill="#9aa0a6">Modules share one twisted-pair bus (CAN-H / CAN-L) terminated by a 120 &#937; resistor at each end.</text>
