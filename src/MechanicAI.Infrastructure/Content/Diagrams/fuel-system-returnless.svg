<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Segoe UI, Arial, sans-serif">
<title>Returnless Fuel System</title>
<desc>Returnless fuel system: in-tank pump module with regulator, single supply line, fuel rail with injectors, rail pressure sensor, pump control module and PCM.</desc>
<defs><marker id="frs-aa8" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#fbbc04"/></marker><marker id="frs-ab8" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#8ab4f8"/></marker></defs>
<rect x="0.75" y="0.75" width="798.5" height="448.5" rx="14" fill="#16181d" stroke="#3a3f47" stroke-width="1.5"/>
<rect x="24" y="21" width="4" height="21" rx="2" fill="#8ab4f8"/>
<text x="38" y="38" font-size="18" fill="#e8eaed" font-weight="600">Returnless Fuel System</text>
<text x="38" y="57" font-size="12" fill="#9aa0a6">One supply line to the engine; pressure is controlled at the tank module and/or by varying pump speed.</text>
<rect x="24" y="72" width="260" height="120" rx="10" fill="#1c1f25" stroke="#2c3037" stroke-width="1"/>
<text x="38" y="94" font-size="12" fill="#e8eaed" font-weight="600">Mechanical returnless</text>
<text x="38" y="110" font-size="12" fill="#9aa0a6">In-tank regulator holds pressure;</text>
<text x="38" y="125" font-size="12" fill="#9aa0a6">excess fuel stays in the tank.</text>
<text x="38" y="146" font-size="12" fill="#e8eaed" font-weight="600">Electronic returnless</text>
<text x="38" y="162" font-size="12" fill="#9aa0a6">Pump speed is varied to hold rail</text>
<text x="38" y="177" font-size="12" fill="#9aa0a6">pressure using FRP sensor feedback.</text>
