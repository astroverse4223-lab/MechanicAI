<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Segoe UI, Arial, sans-serif">
<title>Disc Brake Assembly (Floating Caliper)</title>
<desc>Cross-section of a floating disc brake caliper: piston, seal, dust boot, brake fluid, inboard and outboard pads, vented rotor, bleeder, hose, guide pin and bracket.</desc>
<defs><marker id="dba-aa9" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#fbbc04"/></marker><marker id="dba-at8" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#e8eaed"/></marker></defs>
<rect x="0.75" y="0.75" width="798.5" height="448.5" rx="14" fill="#16181d" stroke="#3a3f47" stroke-width="1.5"/>
<rect x="24" y="21" width="4" height="21" rx="2" fill="#8ab4f8"/>
<text x="38" y="38" font-size="18" fill="#e8eaed" font-weight="600">Disc Brake Assembly (Floating Caliper)</text>
<text x="38" y="57" font-size="12" fill="#9aa0a6">Section through a single-piston sliding caliper straddling a vented rotor.</text>
