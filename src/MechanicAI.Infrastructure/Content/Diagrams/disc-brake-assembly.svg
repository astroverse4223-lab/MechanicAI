<text x="365" y="86" font-size="12" fill="#e8eaed" text-anchor="middle" font-weight="600">Caliper slides inboard</text>
<polyline points="246,88 186,99" fill="none" stroke="#9aa0a6" stroke-width="1" stroke-opacity="0.9"/>
<circle cx="246" cy="88" r="2.2" fill="#9aa0a6"/>
<text x="182" y="103" font-size="12" fill="#e8eaed" text-anchor="end" font-weight="600">Bleeder screw</text>
<polyline points="301,166 186,136" fill="none" stroke="#9aa0a6" stroke-width="1" stroke-opacity="0.9"/>
<circle cx="301" cy="166" r="2.2" fill="#9aa0a6"/>
<text x="182" y="140" font-size="12" fill="#e8eaed" text-anchor="end" font-weight="600">Piston seal</text>
<polyline points="321,166 186,160" fill="none" stroke="#9aa0a6" stroke-width="1" stroke-opacity="0.9"/>
<circle cx="321" cy="166" r="2.2" fill="#9aa0a6"/>
<text x="182" y="164" font-size="12" fill="#e8eaed" text-anchor="end" font-weight="600">Dust boot</text>
<polyline points="246,200 186,196" fill="none" stroke="#9aa0a6" stroke-width="1" stroke-opacity="0.9"/>
<circle cx="246" cy="200" r="2.2" fill="#9aa0a6"/>
<text x="182" y="200" font-size="12" fill="#e8eaed" text-anchor="end" font-weight="600">Brake fluid</text>
<polyline points="290,228 186,228" fill="none" stroke="#9aa0a6" stroke-width="1" stroke-opacity="0.9"/>
<circle cx="290" cy="228" r="2.2" fill="#9aa0a6"/>
<text x="182" y="232" font-size="12" fill="#e8eaed" text-anchor="end" font-weight="600">Piston</text>
<polyline points="334,250 186,262" fill="none" stroke="#9aa0a6" stroke-width="1" stroke-opacity="0.9"/>
<circle cx="334" cy="250" r="2.2" fill="#9aa0a6"/>
<text x="182" y="266" font-size="12" fill="#e8eaed" text-anchor="end" font-weight="600">Inboard pad</text>
<text x="112" y="304" font-size="12" fill="#e8eaed" text-anchor="end" font-weight="600">Brake hose</text>
<text x="112" y="320" font-size="12" fill="#9aa0a6" text-anchor="end">(from ABS unit)</text>
<polyline points="440,150 476,150" fill="none" stroke="#9aa0a6" stroke-width="1" stroke-opacity="0.9"/>
<circle cx="440" cy="150" r="2.2" fill="#9aa0a6"/>
<text x="480" y="154" font-size="12" fill="#e8eaed" font-weight="600">Caliper body</text>
<polyline points="378,226 476,200" fill="none" stroke="#9aa0a6" stroke-width="1" stroke-opacity="0.9"/>
<circle cx="378" cy="226" r="2.2" fill="#9aa0a6"/>
<text x="480" y="204" font-size="12" fill="#e8eaed" font-weight="600">Outboard pad</text>
<polyline points="368,392 476,392" fill="none" stroke="#9aa0a6" stroke-width="1" stroke-opacity="0.9"/>
<circle cx="368" cy="392" r="2.2" fill="#9aa0a6"/>
<text x="480" y="396" font-size="12" fill="#e8eaed" font-weight="600">Rotor (vented)</text>
<text x="476" y="407" font-size="12" fill="#9aa0a6">turns with the wheel</text>
<polyline points="220,348 220,372 186,372" fill="none" stroke="#9aa0a6" stroke-width="1" stroke-opacity="0.9"/>
<circle cx="220" cy="348" r="2.2" fill="#9aa0a6"/>
<text x="182" y="376" font-size="12" fill="#e8eaed" text-anchor="end" font-weight="600">Caliper bracket</text>
<text x="186" y="387" font-size="12" fill="#9aa0a6" text-anchor="end">bolted to the knuckle</text>
<polyline points="262,340 262,404" fill="none" stroke="#9aa0a6" stroke-width="1" stroke-opacity="0.9"/>
<circle cx="262" cy="340" r="2.2" fill="#9aa0a6"/>
<text x="262" y="408" font-size="12" fill="#e8eaed" text-anchor="middle" font-weight="600">Guide pin + boot</text>
<text x="262" y="423" font-size="12" fill="#9aa0a6" text-anchor="middle">caliper floats on the pins</text>
<rect x="602" y="76" width="174" height="356" rx="10" fill="#1c1f25" stroke="#2c3037" stroke-width="1"/>
<text x="614" y="100" font-size="13" fill="#e8eaed" font-weight="600">How it clamps</text>
<circle cx="623" cy="122" r="9" fill="#fbbc04"/>
<text x="623" y="126.3" font-size="12" fill="#16181d" text-anchor="middle" font-weight="700">1</text>
<text x="638" y="126" font-size="12" fill="#9aa0a6">Pressure pushes the</text>
<text x="638" y="142" font-size="12" fill="#9aa0a6">piston and inboard</text>
<text x="638" y="158" font-size="12" fill="#9aa0a6">pad against the</text>
<text x="638" y="174" font-size="12" fill="#9aa0a6">rotor.</text>
<circle cx="623" cy="194" r="9" fill="#fbbc04"/>
<text x="623" y="198.3" font-size="12" fill="#16181d" text-anchor="middle" font-weight="700">2</text>
<text x="638" y="198" font-size="12" fill="#9aa0a6">The reaction slides</text>
<text x="638" y="214" font-size="12" fill="#9aa0a6">the caliper inboard</text>
<text x="638" y="230" font-size="12" fill="#9aa0a6">on its guide pins,</text>
<text x="638" y="246" font-size="12" fill="#9aa0a6">pulling the outboard</text>
<text x="638" y="262" font-size="12" fill="#9aa0a6">pad in.</text>
<circle cx="623" cy="282" r="9" fill="#fbbc04"/>
<text x="623" y="286.3" font-size="12" fill="#16181d" text-anchor="middle" font-weight="700">3</text>
<text x="638" y="286" font-size="12" fill="#9aa0a6">On release, the</text>
<text x="638" y="302" font-size="12" fill="#9aa0a6">square-cut seal pulls</text>
<text x="638" y="318" font-size="12" fill="#9aa0a6">the piston back</text>
<text x="638" y="334" font-size="12" fill="#9aa0a6">slightly (rollback).</text>
<line x1="614" y1="354" x2="764" y2="354" stroke="#3c4047" stroke-width="1"/>
<text x="614" y="374" font-size="12" fill="#e8eaed">Tip: seized guide pins</text>
<text x="614" y="390" font-size="12" fill="#e8eaed">cause uneven pad wear.</text>
</svg>
