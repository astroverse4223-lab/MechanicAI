<rect x="382" y="164" width="6" height="98" fill="#bdc1c6"/>
<path d="M120,330 L120,219 Q120,213 126,213 L198,213" fill="none" stroke="#fbbc04" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="196" y="205" width="8" height="16" rx="1" fill="#bdc1c6"/>
