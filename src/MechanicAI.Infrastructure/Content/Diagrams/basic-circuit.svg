<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Segoe UI, Arial, sans-serif">
<title>Basic Automotive Circuit</title>
<desc>Series circuit with battery, fuse, switch and lamp, returning through the chassis ground.</desc>
