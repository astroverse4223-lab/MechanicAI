<circle cx="160" cy="222" r="9" fill="#8ab4f8"/>
<text x="160" y="226.3" font-size="12" fill="#16181d" text-anchor="middle" font-weight="700">1</text>
<text x="174" y="227" font-size="13" fill="#e8eaed" font-weight="600">Battery</text>
<text x="160" y="245" font-size="12" fill="#9aa0a6">Power source</text>
<circle cx="229" cy="104" r="9" fill="#8ab4f8"/>
<text x="229" y="108.3" font-size="12" fill="#16181d" text-anchor="middle" font-weight="700">2</text>
<text x="243" y="109" font-size="13" fill="#e8eaed" font-weight="600">Fuse</text>
<text x="250" y="162" font-size="12" fill="#9aa0a6" text-anchor="middle">Protection</text>
<circle cx="349" cy="104" r="9" fill="#8ab4f8"/>
<text x="349" y="108.3" font-size="12" fill="#16181d" text-anchor="middle" font-weight="700">3</text>
<text x="363" y="109" font-size="13" fill="#e8eaed" font-weight="600">Switch</text>
<text x="375" y="162" font-size="12" fill="#9aa0a6" text-anchor="middle">Control</text>
<circle cx="392" cy="205" r="9" fill="#8ab4f8"/>
<text x="392" y="209.3" font-size="12" fill="#16181d" text-anchor="middle" font-weight="700">4</text>
<text x="406" y="210" font-size="13" fill="#e8eaed" font-weight="600">Lamp</text>
<text x="384" y="228" font-size="12" fill="#9aa0a6">Load &#8212; does the work</text>
<circle cx="598" cy="330" r="9" fill="#8ab4f8"/>
<text x="598" y="334.3" font-size="12" fill="#16181d" text-anchor="middle" font-weight="700">5</text>
<text x="612" y="335" font-size="13" fill="#e8eaed" font-weight="600">Ground</text>
<text x="470" y="122" font-size="12" fill="#f28b82" text-anchor="middle" font-weight="600">Power side (B+)</text>
<text x="552" y="272" font-size="12" fill="#81c995" font-weight="600">Ground side</text>
<rect x="646" y="84" width="130" height="206" rx="10" fill="#1c1f25" stroke="#2c3037" stroke-width="1"/>
<text x="660" y="108" font-size="12" fill="#e8eaed" font-weight="600">Every circuit needs</text>
<circle cx="668" cy="134" r="9" fill="#8ab4f8"/>
<text x="668" y="138.3" font-size="12" fill="#16181d" text-anchor="middle" font-weight="700">1</text>
<text x="684" y="139" font-size="12" fill="#e8eaed">Power source</text>
<circle cx="668" cy="166" r="9" fill="#8ab4f8"/>
<text x="668" y="170.3" font-size="12" fill="#16181d" text-anchor="middle" font-weight="700">2</text>
<text x="684" y="171" font-size="12" fill="#e8eaed">Protection</text>
<circle cx="668" cy="198" r="9" fill="#8ab4f8"/>
<text x="668" y="202.3" font-size="12" fill="#16181d" text-anchor="middle" font-weight="700">3</text>
<text x="684" y="203" font-size="12" fill="#e8eaed">Control</text>
<circle cx="668" cy="230" r="9" fill="#8ab4f8"/>
<text x="668" y="234.3" font-size="12" fill="#16181d" text-anchor="middle" font-weight="700">4</text>
<text x="684" y="235" font-size="12" fill="#e8eaed">Load</text>
<circle cx="668" cy="262" r="9" fill="#8ab4f8"/>
<text x="668" y="266.3" font-size="12" fill="#16181d" text-anchor="middle" font-weight="700">5</text>
<text x="684" y="267" font-size="12" fill="#e8eaed">Ground path</text>
<text x="24" y="392" font-size="12" fill="#9aa0a6">Current flows only when the loop is complete. Opening the switch, a blown fuse, or a broken wire or ground stops current</text>
<text x="24" y="409" font-size="12" fill="#9aa0a6">everywhere in the loop; extra resistance anywhere in the loop reduces current to the load.</text>
<text x="776" y="434" font-size="12" fill="#9aa0a6" text-anchor="end" font-style="italic">Arrows show conventional current flow (+ to &#8722;).</text>
</svg>
